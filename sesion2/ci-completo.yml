# CI completo de la Sesión 1 (retos 1 a 4). Úsenlo SOLO si su equipo no terminó ayer:
# cópienlo en .github/workflows/ci.yml y copien test_calidad_modelo.py en tests/.
# El pipeline de CD de hoy necesita un workflow que se llame exactamente "CI" y que esté en verde.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.11
      - run: ruff check .
      - run: ruff format --check .

  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas unitarias y de API con cobertura (mínimo 80%)
        run: >
          pytest -v --ignore=tests/test_calidad_modelo.py
          --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Guardar el reporte de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage.xml

  calidad-modelo:
    name: Quality gate del modelo
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      UMBRAL_EXACTITUD: "0.80"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Exactitud del clasificador sobre datos de evaluación
        run: pytest -v -s tests/test_calidad_modelo.py
